services:

  mysql-auth:
    image: mysql:8.0.39
    container_name: mysql-auth
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"

  mysql-usuario:
    image: mysql:8.0.39
    container_name: mysql-usuario
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: usuario_db
    ports:
      - "3308:3306"

  mysql-profesor:
    image: mysql:8.0.39
    container_name: mysql-profesor
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: profesor_db

    ports:
      - "3309:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10

  profesor-service:
    build: ./profesor-service
    container_name: profesor-service

    depends_on:
      mysql-profesor:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8083:8083"

  mysql-clase:
    image: mysql:8.0.39
    container_name: mysql-clase
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: clase_db
    ports:
      - "3310:3306"

  mysql-reserva:
    image: mysql:8.0.39
    container_name: mysql-reserva
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reserva_db
    ports:
      - "3311:3306"

  mysql-pago:
    image: mysql:8.0.39
    container_name: mysql-pago
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pago_db
    ports:
      - "3312:3306"
  mysql-notificacion:
    image: mysql:8.0.39
    container_name: mysql-notificacion
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notificacion_db
    ports:
      - "3313:3306"

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server

    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - eureka-server

    ports:
      - "8080:8080"