# ✅ Configuración SOLO para tests
# Esta versión usa H2 (base de datos en memoria) en lugar de MySQL
# Spring la activa automáticamente cuando corre los tests

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas automáticamente desde las entidades (solo en tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactivamos Flyway en tests (H2 no necesita las migraciones SQL de MySQL)
spring.flyway.enabled=false

# Desactivamos Security en tests para no necesitar tokens JWT
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
