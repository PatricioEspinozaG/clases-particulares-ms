server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/auth/**

          - id: usuario-service
            uri: lb://USUARIO-SERVICE
            predicates:
              - Path=/usuarios/**

          - id: profesor-service
            uri: lb://PROFESOR-SERVICE
            predicates:
              - Path=/profesores/**

          - id: clase-service
            uri: lb://CLASE-SERVICE
            predicates:
              - Path=/clases/**

          - id: reserva-service
            uri: lb://RESERVA-SERVICE
            predicates:
              - Path=/reservas/**

          - id: pago-service
            uri: lb://PAGO-SERVICE
            predicates:
              - Path=/pagos/**

          - id: notificacion-service
            uri: lb://NOTIFICACION-SERVICE
            predicates:
              - Path=/notificaciones/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/